services:
  db:
    image: mysql:8.0
    # restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: album_battler
      MYSQL_USER: album_user
      MYSQL_PASSWORD: album_pass
    ports:
      - 3306:3306
    volumes:
      # 開発用ではデータ永続化を無効にする
      # - mysql_data:/var/lib/mysql
      - ./backend/migrations/init_db.sql:/docker-entrypoint-initdb.d/01-init_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - 8080:8080
    volumes:
      - ./backend:/app
      - backend_cache:/go/pkg/mod
    env_file:
      - ./backend/.env
    environment:
      - GO_ENV=development
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=album_battler
      - DB_USER=album_user
      - DB_PASSWORD=album_pass
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    # restart: unless-stopped
    ports:
      - 8081:80
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=rootpass
    depends_on:
      db:
        condition: service_healthy

volumes:
  frontend_node_modules:
  frontend_next:
  backend_cache:
  mysql_data:
