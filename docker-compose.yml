services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - 8080:8080
    volumes:
      - ./backend:/app
      - backend_cache:/go/pkg/mod
    environment:
      - GO_ENV=development

volumes:
  frontend_node_modules:
  frontend_next:
  backend_cache:
